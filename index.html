<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">

  <title>서울과기대 강의실 시간표</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main>

  <header>
    <h1>서울과기대 강의실 시간표</h1>
    <p>2026학년도 2학기 · 월–일 · 0–14교시</p>
  </header>


  <section class="quick-card" aria-label="현재 사용 가능한 강의실">

    <div>
      <strong>지금 비어 있는 강의실</strong>
      <p id="nowText">
        서울 시간을 확인하고 있습니다.
      </p>
    </div>

    <button id="findFreeBtn" type="button">
      현재 사용 가능한 강의실 찾기
    </button>

  </section>


  <section
    id="freePanel"
    class="free-panel"
    hidden
  >

    <div class="free-head">

      <div>
        <h2>현재 사용 가능한 강의실</h2>
        <p id="freeSummary"></p>
      </div>

      <button
        id="closeFreeBtn"
        class="ghost-btn"
        type="button"
      >
        닫기
      </button>

    </div>

    <div
      id="freeRooms"
      class="free-rooms"
    ></div>

  </section>


  <section class="controls">

    <label>
      건물
      <select id="building"></select>
    </label>

    <label>
      강의실
      <select id="room"></select>
    </label>

  </section>


  <section id="summary"></section>


  <div class="mobile-hint">
    ← 시간표를 좌우로 밀어서 다른 요일을 볼 수 있어요 →
  </div>


  <div class="table-wrap">

    <div
      id="timetable"
      class="timetable"
    ></div>

  </div>


  <footer>
    서울과학기술대학교 공개 시간표 원본을 기준으로 표시합니다.
  </footer>

</main>


<script>
  /*
   * 서울 시간 기준으로 현재 학기 버전을 계산한다.
   *
   * 3월 ~ 8월  → 1학기
   * 9월 ~ 12월 → 2학기
   * 1월 ~ 2월  → 전년도 2학기
   */

  const now = new Date();

  const seoulDate = new Date(
    now.toLocaleString("en-US", {
      timeZone: "Asia/Seoul"
    })
  );

  const year = seoulDate.getFullYear();
  const month = seoulDate.getMonth() + 1;

  let semesterVersion;

  if (month >= 9) {

    semesterVersion = `${year}2`;

  } else if (month >= 3) {

    semesterVersion = `${year}1`;

  } else {

    semesterVersion = `${year - 1}2`;

  }


  /*
   * 예:
   *
   * 2026년 9월
   * data.js?v=20262
   *
   * 2027년 3월
   * data.js?v=20271
   */

  const dataScript = document.createElement("script");

  dataScript.src =
    `data.js?v=${semesterVersion}`;


  /*
   * data.js가 완전히 로드된 후
   * 사이트 프로그램 실행
   */

  dataScript.onload = () => {

    const appScript =
      document.createElement("script");

    appScript.src = "script.js";

    document.body.appendChild(appScript);

  };


  document.body.appendChild(dataScript);

</script>


</body>
</html>
