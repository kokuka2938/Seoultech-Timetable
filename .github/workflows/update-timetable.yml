name: Update SeoulTech Timetable

on:
  schedule:
    # GitHub Actions cron은 UTC 기준
    # 한국시간 3월 1일 09:00 = UTC 3월 1일 00:00
    # 한국시간 9월 1일 09:00 = UTC 9월 1일 00:00
    - cron: "0 0 1 3 *"
    - cron: "0 0 1 9 *"

  # 필요할 때 직접 실행할 수 있도록 유지
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-timetable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Update timetable
        run: python update_timetable.py

      - name: Commit updated timetable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js seoultech_RAW_*.json
          git diff --cached --quiet && exit 0
          git commit -m "Update SeoulTech timetable"
          git push
